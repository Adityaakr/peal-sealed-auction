name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv
        env:
          FOUNDRY_PROFILE: ci

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The qore-pq-kit git dependency is recorded as git+ssh; fetch it over https.
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ts

  e2e-local:
    # Playwright 1.56 has no headless shell for Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci
      - run: npm run e2e:local
      - run: npx playwright-core install --only-shell chromium
      - run: npm run web:build
      - run: npm run web:smoke
