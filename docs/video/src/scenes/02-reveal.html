<!-- {"id":"reveal","start":15.75,"dur":14.1} -->
<style>
  #s2-lock { position: absolute; left: 510px; top: 404px; width: 900px; height: 132px; }
  #s2-lockwrap { position: absolute; inset: 0; }
  #s2-kicker { position: absolute; left: 0; right: 0; top: 600px; text-align: center; font-size: 28px; color: var(--paper-2); }
  #s2-view { left: 120px; top: 120px; width: 1680px; height: 880px; }
  #s2-hl-vault { left: 836px; top: 184px; width: 458px; height: 446px; }
  #s2-hl-keys { left: 850px; top: 541px; width: 354px; height: 48px; }
  #s2-hl-close { left: 850px; top: 576px; width: 410px; height: 34px; }
</style>
<div class="stage" id="s2-stage">
  <div id="s2-lockwrap">
    <img id="s2-lock" src="assets/brand/lockup-dark.svg" alt="Peal Sealed Auction" />
    <div id="s2-kicker" class="mono">Encrypted Apps · QoreChain testnet</div>
  </div>
  <div class="chap" id="s2-chap"><b>02</b> &nbsp;Peal Sealed Auction · the landing page</div>
  <div class="view" id="s2-view">
    <div class="cam" id="s2-cam" style="width:1440px">
      <img src="assets/shots/hero.png" width="1440" height="900" alt="The landing page hero and the open demo auction's sealed slots" />
      <div class="hl plain" id="s2-hl-vault" style="border-color: transparent; box-shadow: 0 0 0 4000px rgba(14,16,22,0.72);"></div>
      <div class="hl" id="s2-hl-keys"></div>
      <div class="hl" id="s2-hl-close"></div>
    </div>
  </div>
</div>
<script>
  const BOX = { x: 0, y: 0, w: 1680, h: 870 };
  // "Peal Sealed Auction removes that key holder."
  tl.fromTo("#s2-lock", { opacity: 0, filter: "blur(10px)", scale: 0.97 }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.7, ease: "expo.out" }, 0.1);
  inn("#s2-kicker", 1.2);
  out("#s2-lockwrap", 3.55, 0.3);
  // "Every bid gets its own key, split across a committee of three."
  camSet("#s2-cam", [100, 140, 1240, 560], BOX);
  inn("#s2-chap", 3.75);
  inn("#s2-view", 3.8, { d: 0.5 });
  camTo("#s2-cam", [884, 175, 700, 470], BOX, 4.4, 1.4);
  hlIn("#s2-hl-vault", 4.3);
  hlOut("#s2-hl-vault", 6.2);
  hlIn("#s2-hl-keys", 6.3);
  // "No one can open a bid until two of the three keys meet"
  hlOut("#s2-hl-keys", 8.2);
  camTo("#s2-cam", [130, 200, 680, 200], BOX, 8.2, 1.3);
  // "and that only happens after the chain closes bidding."
  camTo("#s2-cam", [810, 470, 520, 170], BOX, 11.4, 1.1);
  hlIn("#s2-hl-close", 12.4);
  endScene("#s2-stage");
</script>
