<div class="stage" id="s3-stage">
  <div class="chap" id="s3-chap"><b>03</b> &nbsp;How a bid is sealed</div>
  <div class="view" id="s3-view">
    <div class="cam" id="s3-cam" style="width:1440px">
      <img src="assets/shots/anatomy.png" width="1440" height="1101" alt="The landing page's anatomy of a sealed bid: plaintext, K and its shares, commitBid's fields, three envelopes" />
      <div class="hl" id="s3-hl-pt"></div>
      <div class="hl" id="s3-hl-k"></div>
      <div class="hl" id="s3-hl-members"></div>
      <div class="hl" id="s3-hl-commit"></div>

<script>
  const BOX = { x: 0, y: 0, w: 1680, h: 870 };
  // "Here is what one bid puts on chain."
  camSet("#s3-cam", [140, 100, 1160, 690], BOX);
  inn("#s3-chap", 0.0);
  inn("#s3-view", 0.05, { d: 0.45 });
  camTo("#s3-cam", [130, 380, 1180, 440], BOX, 1.4, 1.4);
  // "The browser packs quantity and price into thirty-two bytes"
  camTo("#s3-cam", [120, 380, 520, 420], BOX, 3.2, 1.3);
  hlIn("#s3-hl-pt", 4.7);
  // "K is split into three shares."
  hlOut("#s3-hl-pt", 7.9);
  hlIn("#s3-hl-k", 8.3);
  // "Each share is sealed with ML-KEM-1024, to one member's key registered on chain."
  hlOut("#s3-hl-k", 10.3);
  camTo("#s3-cam", [570, 400, 740, 390], BOX, 10.4, 1.3);
  hlIn("#s3-hl-members", 12.2);
  camTo("#s3-cam", [590, 410, 700, 370], BOX, 12.9, 3.4);
  // "The contract stores the ciphertext and the hashes, and holds the escrow."
  hlOut("#s3-hl-members", 16.3);
  hlIn("#s3-hl-commit", 16.8);
  // "There is no reveal step"
  hlOut("#s3-hl-commit", 20.6);
  camTo("#s3-cam", [130, 860, 1180, 150], BOX, 20.7, 1.2);
  hlIn("#s3-hl-fixed", 21.9);
  endScene("#s3-stage");
</script>
