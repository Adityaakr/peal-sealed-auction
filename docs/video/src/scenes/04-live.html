<div class="stage" id="s4-stage">

<script>
  const BOX = { x: 0, y: 0, w: 1680, h: 870 };
  inn("#s4-chap", 0.0);
  inn("#s4-note", 0.8);
  // "A visitor creates a guest account in the browser"
  camSet("#s4-c1", [0, 0, 420, 480], BOX);
  inn("#s4-v1", 0.05, { d: 0.45 });
  hlIn("#s4-hl-create", 4.3);
  out("#s4-v1", 6.3, 0.3);
  // "and funds it with test QOR."
  camSet("#s4-c2", [0, 100, 420, 380], BOX);
  inn("#s4-v2", 6.5, { d: 0.45 });
  hlIn("#s4-hl-bal", 7.3);
  out("#s4-v2", 8.0, 0.3);
  // "On the bid page, it checks every committee member ... Three green checks."
  camSet("#s4-c3", [215, 720, 1010, 330], BOX);
  inn("#s4-v3", 8.2, { d: 0.45 });
  camTo("#s4-c3", [225, 760, 990, 280], BOX, 9.0, 9.5);
  hlIn("#s4-hl-how", 11.9);
  hlOut("#s4-hl-how", 18.3);
  hlIn("#s4-hl-checks", 18.8);
  // "Then: seal in this browser, and commit."
  hlOut("#s4-hl-checks", 19.9);
  camTo("#s4-c3", [215, 1050, 1010, 245], BOX, 20.0, 1.0);
  hlIn("#s4-hl-seal", 21.0);
  out("#s4-v3", 22.5, 0.3);
  // "The page registers the guest's post-quantum key, opens one EVM window scoped to the three contracts"
  camSet("#s4-c4", [0, 100, 420, 320], BOX);
  inn("#s4-v4", 22.7, { d: 0.45 });
  hlIn("#s4-hl-key", 23.6);
  hlOut("#s4-hl-key", 25.6);
  hlIn("#s4-hl-win", 25.9);
  // "and sends the faucet claim, the approval, and the sealed bid."
  hlOut("#s4-hl-win", 29.6);
  hlIn("#s4-hl-txs", 29.9);
  out("#s4-v4", 33.1, 0.3);
  // "Three envelopes, seventeen hundred and fifty-two bytes each. Nobody can read it."
  camSet("#s4-c5", [215, 1320, 1010, 300], BOX);
  inn("#s4-v5", 33.3, { d: 0.45 });
  hlIn("#s4-hl-env", 34.0);
  camTo("#s4-c5", [225, 1330, 960, 280], BOX, 34.6, 3.6);
  endScene("#s4-stage");
</script>
