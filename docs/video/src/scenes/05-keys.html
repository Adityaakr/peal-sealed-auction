<style>
  #s5-view { left: 120px; top: 120px; width: 1680px; height: 880px; }
  #s5-hl-members { left: 144px; top: 419px; width: 269px; height: 166px; }
  #s5-hl-verify { left: 545px; top: 519px; width: 235px; height: 101px; }
  #s5-hl-outsider { left: 144px; top: 677px; width: 269px; height: 79px; }
  #s5-hl-rsi { left: 564px; top: 634px; width: 197px; height: 56px; }
  #s5-hl-open { left: 841px; top: 519px; width: 459px; height: 101px; }
</style>
<div class="stage" id="s5-stage">
  <div class="chap" id="s5-chap"><b>05</b> &nbsp;After the close</div>
  <div class="view" id="s5-view">
    <div class="cam" id="s5-cam" style="width:1440px">
      <img src="assets/shots/keys.png" width="1440" height="1513" alt="The landing page: releases through pqcVerify to K and openBids, and what is refused" />
      <div class="hl" id="s5-hl-members"></div>
      <div class="hl" id="s5-hl-verify"></div>
      <div class="hl red" id="s5-hl-outsider"></div>
      <div class="hl red plain" id="s5-hl-rsi"></div>
      <div class="hl" id="s5-hl-open"></div>
    </div>
  </div>
</div>
<script>
  const BOX = { x: 0, y: 0, w: 1680, h: 870 };
  // "each member opens its own shares, and signs one release over every bid"
  camSet("#s5-cam", [130, 405, 1180, 370], BOX);
  inn("#s5-chap", 0.0);
  inn("#s5-view", 0.05, { d: 0.45 });
  camTo("#s5-cam", [140, 410, 1160, 360], BOX, 0.9, 3.3);
  hlIn("#s5-hl-members", 4.3);
  camTo("#s5-cam", [150, 415, 1140, 350], BOX, 5.0, 4.4);
  // "The contract checks each signature with pqcVerify"
  hlOut("#s5-hl-members", 9.6);
  hlIn("#s5-hl-verify", 10.0);
  camTo("#s5-cam", [135, 405, 1170, 365], BOX, 10.6, 3.6);
  // "so a forged release reverts."
  hlOut("#s5-hl-verify", 14.3);
  hlIn("#s5-hl-outsider", 14.6);
  hlIn("#s5-hl-rsi", 15.2);
  // "One share alone is just a random number."
  hlOut("#s5-hl-outsider", 16.3);
  hlOut("#s5-hl-rsi", 16.3);
  camTo("#s5-cam", [440, 125, 700, 240], BOX, 16.4, 1.3);
  // "Two releases are enough: the contract rebuilds each key, and decrypts every bid itself."
  camTo("#s5-cam", [520, 490, 800, 160], BOX, 19.1, 1.3);
  hlIn("#s5-hl-open", 21.4);
  endScene("#s5-stage");
</script>
