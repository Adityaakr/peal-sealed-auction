[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
fs_permissions = [{ access = "read", path = "./vectors" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 4096

[profile.ci.invariant]
runs = 512
depth = 128

# Public QoreChain EVM endpoints. Use them by name:
#   forge script ... --rpc-url qorechain_testnet
[rpc_endpoints]
qorechain = "https://evm.qore.host"
qorechain_testnet = "https://evm-testnet.qore.host"
