[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "qore-pq-kit/=lib/qore-pq-kit/src/",
  "qore-pq-kit-test/=lib/qore-pq-kit/test/",
  "qorechain-asset-kit/=lib/qorechain-asset-kit/contracts/src/",
]
fs_permissions = [{ access = "read", path = "./vectors" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 4096

[profile.ci.invariant]
runs = 512
depth = 128

[lint]
# Auction phases are defined by timestamps on purpose; validator skew of a few
# seconds does not matter at these durations.
exclude_lints = ["block-timestamp"]
# Tests cast fuzz inputs and use plain transfers on known mock tokens on purpose.
ignore = ["test/**/*.sol"]

# Public QoreChain EVM endpoints. Use them by name:
#   forge script ... --rpc-url qorechain_testnet
[rpc_endpoints]
qorechain = "https://evm.qore.host"
qorechain_testnet = "https://evm-testnet.qore.host"
